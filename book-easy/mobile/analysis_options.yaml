include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Treat missing awaits and dead code as build-breaking issues.
    unawaited_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_single_quotes
    - unawaited_futures
    - use_build_context_synchronously
