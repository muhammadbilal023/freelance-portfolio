services:
  payments-api:
    build: .
    container_name: book-easy-payments-api
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
