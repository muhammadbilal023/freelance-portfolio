services:
  syncflow:
    build: .
    container_name: syncflow
    restart: unless-stopped
    ports:
      - '8081:8081'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/syncflow.db
    volumes:
      - syncflow-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  syncflow-data:
